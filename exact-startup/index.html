<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H25 UNIT-20 — START-UP / original layout</title>
<link rel="stylesheet" href="screen.css">
</head>
<body>
<main id="screen-holder" aria-label="H25 UNIT-20 START-UP">
<svg id="hmi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 574" preserveAspectRatio="none" role="group" aria-label="H25 Gas Turbine Generator UNIT-20 START-UP, native vector recreation"></svg>
</main>
<footer id="tools"><span id="message" role="status">START-UP · векторная перерисовка исходной компоновки · эталонные показания</span><button id="live-button" title="Включить или приостановить учебную модель">▶ СИМУЛЯЦИЯ</button><button id="full-button">⛶ TO‘LIQ EKRAN</button><button id="sound-button" aria-pressed="false" title="Звук аварии">🔇</button></footer>
<dialog id="load-dialog"><form id="load-form"><h2>Load Set Value</h2><label>Load setpoint <input id="load-input" type="number" min="0" max="32" step="0.1" required> MW</label><p><button type="button" id="load-apply">ENTER</button><button type="button" id="load-cancel">CANCEL</button></p></form></dialog>
<div id="command-feedback" role="status" hidden></div>
<dialog id="action-dialog"><form method="dialog"><h2 id="action-title"></h2><p id="action-text"></p><p><button type="button" id="action-ok" value="ok">ENTER</button><button type="button" id="action-cancel" value="cancel">CANCEL</button></p></form></dialog>
<dialog id="cal-dialog"><form method="dialog"><h2 id="cal-title">Lift calibration</h2><p>Учебный режим. Калибровка разрешена только при остановленном роторе и без пламени.</p><label>Position <input id="cal-input" type="range" min="0" max="100" step="0.5"><output id="cal-output">0 %</output></label><p id="cal-note"></p><button type="button" id="cal-close" value="close">CLOSE</button></form></dialog>
<script src="core.bundle.js"></script><script src="model-controls.js"></script><script src="startup-data.js"></script><script src="views.js"></script><script src="screen.js"></script>
</body></html>
